name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Unit & architecture tests
        run: |
          dotnet test --no-build -c Release --project tests/DocuMind.UnitTests
          dotnet test --no-build -c Release --project tests/DocuMind.ArchitectureTests
      - name: "Integration tests (Testcontainers: Postgres + Qdrant)"
        run: dotnet test --no-build -c Release --project tests/DocuMind.IntegrationTests

  frontend:
    name: React lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
